[build-system]
  requires = ['setuptools>=61.0.0']
  build-backend = 'setuptools.build_meta'

[tool.setuptools]
  packages = ["cats", "cats.providers"]
  package-data.cats = ["config.yml", "data/*.txt"]

[project]
  name = "climate-aware-task-scheduler"
  dynamic = ["version"]
  description = "Lightweight Python package designed to schedule tasks based on the estimated carbon intensity of the electricity grid at any given moment"
  keywords = [
    "carbon intensity",
    "carbon-aware computing",
    "carbon-aware scheduling",
    "climate-aware computing",
    "task scheduling",
    "HPC",
    "high-performance computing",
    "energy-aware computing",
    "green computing",
  ]
  authors = [
    { name = "Colin Sauze" },
    { name = "Andrew Walker"},
    { name = "Loïc Lannelongue" },
    { name = "Thibault Lestang" },
    { name = "Tony Greenberg" },
    { name = "Lincoln Colling" },
    { name = "Adam Ward" },
    { name = "Abhishek Dasgupta" },
    { name = "Carlos Martinez" },
    { name = "Sadie Bartholomew" }
  ]
  maintainers = [
    { name = "Sadie Bartholomew" },
    { name = "Abhishek Dasgupta" },
  ]
  license = "MIT"
  license-files = ["LICENSE"]
  requires-python = ">=3.11"
  readme = "README.md"
  classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Distributed Computing :: Batch Processing",
  ]
  dependencies = ["requests-cache>=1.0", "PyYAML>=6.0", "tzdata ; platform_system == 'Windows'"]

  [tool.setuptools.dynamic]
    version = {attr = "cats.version.version"}

  [tool.pytest.ini_options]
    markers = ["fixt_data: data for fixtures"]

  [project.optional-dependencies]
    test = ["pytest", "numpy>=1.5.0", "pytest-subprocess==1.5.0", "pytest-cov", "matplotlib>=3.0"]
    types = ["mypy", "types-PyYAML", "types-redis", "types-requests", "types-ujson"]
    docs = ["sphinx==6.*", "sphinx-argparse", "ghp-import", "renku-sphinx-theme", "sphinx_copybutton", "sphinxcontrib-bibtex"]
    plots = ["matplotlib>=3.0"]

  [project.urls]
    Home = "https://github.com/GreenScheduler/cats"
    Documentation = "https://cats.readthedocs.io/"
    Repository = "https://github.com/GreenScheduler/cats"
    Issues = "https://github.com/GreenScheduler/cats/issues"

  [project.scripts]
    cats = "cats.cli:main"

  [tool.ruff.lint]
    # Pyflakes (`F`), subset of the pycodestyle (`E`) and unsorted imports (`I001`)
    select = ["E4", "E7", "E9", "F", "I001"]

  [tool.basedpyright]
    reportExplicitAny = false
