services:
  mysql:
    image: mariadb:10.11
    hostname: mysql
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm-network

  slurmdbd:
    image: ghcr.io/greenscheduler/slurm-docker-cluster:latest
    command: ["slurmdbd"]
    container_name: slurmdbd
    hostname: slurmdbd
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      - mysql
    networks:
      - slurm-network

  slurmctld:
    image: ghcr.io/greenscheduler/slurm-docker-cluster:latest
    command: ["slurmctld"]
    container_name: slurmctld
    hostname: slurmctld
    environment:
      CATS_HISTORY_DB: /var/lib/cats/history.sqlite3
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
      - cats_data:/var/lib/cats
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - slurm-network

  catsd:
    image: ghcr.io/greenscheduler/slurm-docker-cluster:latest
    container_name: catsd
    command:
      - bash
      - -lc
      - |
        set -e
        gosu munge /usr/sbin/munged
        source_dir=$(mktemp -d /tmp/cats-source.XXXXXX)
        cp /opt/cats/pyproject.toml "$$source_dir/"
        cp -a /opt/cats/cats "$$source_dir/"
        uv tool install --reinstall "$$source_dir"
        rm -rf "$$source_dir"
        until scontrol ping >/dev/null 2>&1; do sleep 5; done
        exec /root/.local/bin/catsd
    environment:
      CATS_HISTORY_DB: /var/lib/cats/history.sqlite3
      CATS_DAEMON_INTERVAL_SECONDS: "3600"
      CATS_EXECUTABLE: /root/.local/bin/cats
    volumes:
      - ../:/opt/cats:ro
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - cats_data:/var/lib/cats
    depends_on:
      - slurmctld
    restart: unless-stopped
    networks:
      - slurm-network

  c1:
    image: ghcr.io/greenscheduler/slurm-docker-cluster:latest
    command: ["slurmd"]
    hostname: c1
    container_name: c1
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - slurm-network

  c2:
    image: ghcr.io/greenscheduler/slurm-docker-cluster:latest
    command: ["slurmd"]
    hostname: c2
    container_name: c2
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - slurm-network

volumes:
  etc_munge:
  etc_slurm:
  slurm_jobdir:
  var_lib_mysql:
  var_log_slurm:
  cats_data:

networks:
  slurm-network:
    driver: bridge
